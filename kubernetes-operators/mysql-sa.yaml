apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-operator
  namespace: homework

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mysql-operator-role
rules:
# - apiGroups: ["*"]
#   resources: ["*"]
#   verbs: ["*"]
# - nonResourceURLs: ["*"]
#   verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["mysql.otus.homework"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""] # Ядро Kubernetes API
    resources: ["services", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mysql-operator-binding
subjects:
- kind: ServiceAccount
  name: mysql-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: mysql-operator-role
  apiGroup: rbac.authorization.k8s.io